name: Compilar Executáveis (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar MK Writer para Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Compilar aplicativo com PyInstaller
        run: |
          pyinstaller --noconfirm MK-Writer.spec

      - name: Compactar pasta de distribuição Windows
        shell: powershell
        run: |
          Compress-Archive -Path dist/MK-Writer -DestinationPath MK-Writer-Windows.zip -Force

      - name: Salvar artefato para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MK-Writer-Windows
          path: MK-Writer-Windows.zip
          retention-days: 30

      - name: Anexar ao Release (se disparado por tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MK-Writer-Windows.zip

  build-linux:
    name: Compilar MK Writer para Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Compilar aplicativo com PyInstaller
        run: |
          pyinstaller --noconfirm MK-Writer.spec

      - name: Criar pacote .tar.gz
        run: |
          tar -czvf MK-Writer-Linux.tar.gz -C dist MK-Writer

      - name: Salvar artefato para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MK-Writer-Linux
          path: MK-Writer-Linux.tar.gz
          retention-days: 30

      - name: Anexar ao Release (se disparado por tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MK-Writer-Linux.tar.gz
