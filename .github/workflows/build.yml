name: Compilar Executáveis (Windows & Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar MK Writer para Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Compilar aplicativo com PyInstaller
        run: |
          pyinstaller --noconfirm MK-Writer.spec

      - name: Incluir atalhos e manuais na distribuição Windows
        shell: powershell
        run: |
          if (Test-Path "criar_atalho.bat") { Copy-Item "criar_atalho.bat" -Destination "dist/MK-Writer/" }
          if (Test-Path "MANUAL_DE_INSTALACAO.md") { Copy-Item "MANUAL_DE_INSTALACAO.md" -Destination "dist/MK-Writer/" }

      - name: Compactar pasta de distribuição Windows
        shell: powershell
        run: |
          Compress-Archive -Path dist/MK-Writer -DestinationPath MK-Writer-Windows.zip -Force

      - name: Salvar artefato para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MK-Writer-Windows
          path: MK-Writer-Windows.zip
          retention-days: 30

  build-linux:
    name: Compilar MK Writer para Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Compilar aplicativo com PyInstaller
        run: |
          pyinstaller --noconfirm MK-Writer.spec

      - name: Incluir atalho e manuais na distribuição Linux
        run: |
          if [ -f "instalar_atalho.sh" ]; then
            cp instalar_atalho.sh dist/MK-Writer/
            chmod +x dist/MK-Writer/instalar_atalho.sh
          fi
          if [ -f "MANUAL_DE_INSTALACAO.md" ]; then
            cp MANUAL_DE_INSTALACAO.md dist/MK-Writer/
          fi

      - name: Criar pacote .tar.gz
        run: |
          tar -czvf MK-Writer-Linux.tar.gz -C dist MK-Writer

      - name: Salvar artefato para download no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MK-Writer-Linux
          path: MK-Writer-Linux.tar.gz
          retention-days: 30

  publish-release:
    name: Publicar Release Oficial no GitHub
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: MK-Writer-Windows

      - name: Baixar artefato Linux
        uses: actions/download-artifact@v4
        with:
          name: MK-Writer-Linux

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MK Writer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MK-Writer-Windows.zip
            MK-Writer-Linux.tar.gz
          body: |
            ## 📘 MK Writer - Editor & Compilador Acadêmico Modular

            Seja bem-vindo à versão oficial do **MK Writer**!

            ### 📦 Binários Prontos para Execução
            * **Windows (10/11 x64)**: Baixe `MK-Writer-Windows.zip`, descompacte e execute `MK-Writer.exe`.
            * **Linux (x64)**: Baixe `MK-Writer-Linux.tar.gz`, descompacte e execute `./MK-Writer/MK-Writer`.

            ### ✨ Principais Recursos desta Versão
            * ✍️ **Editor Acadêmico Modular**: Organização em seções Pré-Textuais, Textuais e Pós-Textuais com suporte a `!include`.
            * 📦 **Pacotes de Projeto (.mkw)**: Encapsulamento completo de capítulos, imagens, estilos ABNT e referências BibTeX em um arquivo único.
            * 📄 **Visualizador PDF ABNT em Tempo Real**: Pré-visualização com margens 3-3-2-2 cm, fontes institucionais, sumário dinâmico e compilação instantânea (`F5`).
            * 📐 **Barra de Ferramentas Acadêmica**: Atalhos com um clique para fórmulas LaTeX, figuras centralizadas com fonte obrigatória, tabelas e citações.
            * 🤖 **Assistente IA Integrado**: Apoio à redação científica e adequação do tom acadêmico.
